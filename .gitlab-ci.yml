# Windows CI Pipeline for gnome-network-displays
# Requires Windows runner with .NET 8 SDK

stages:
  - build
  - test

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

.windows_build:
  before_script:
    - dotnet --version
    - dotnet restore src-windows/gnome-network-displays.sln
  after_script:
    - Get-ChildItem -Recurse -Filter "*.exe" | Select-Object -ExpandProperty FullName

build_debug:
  stage: build
  tags:
    - windows
  script:
    - dotnet build src-windows/gnome-network-displays.sln -c Debug
  artifacts:
    name: windows-debug-binaries
    paths:
      - src-windows/**/bin/Debug/**
    expire_in: 1 week
  only:
    - branches
    - merge_requests

build_release:
  stage: build
  tags:
    - windows
  script:
    - dotnet build src-windows/gnome-network-displays.sln -c Release -r win-x64 --self-contained
    - dotnet build src-windows/gnome-network-displays.sln -c Release -r win-arm64 --self-contained
  artifacts:
    name: windows-release-binaries
    paths:
      - src-windows/**/bin/Release/**/*.exe
    expire_in: 1 month
  only:
    - tags
    - master

# Cross-compile from Linux using dotnet (limited)
build_linux_cross:
  stage: build
  tags:
    - linux
  image: mcr.microsoft.com/dotnet/sdk:8.0
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake ninja-build > /dev/null 2>&1 || true
  script:
    - dotnet restore src-windows/gnome-network-displays.sln
    # Note: .NET can cross-compile managed assemblies, but not native dependencies
    # This builds the managed code for Windows but skips native components
    - dotnet build src-windows/gnome-network-displays.sln -c Release -r win-x64 --no-dependencies 2>&1 || echo "Cross-compile limited - native deps need Windows"
  only:
    - merge_requests
  allow_failure: true

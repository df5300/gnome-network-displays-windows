name: Windows Build

on:
  push:
    branches: [windows-port, master]
  pull_request:
    branches: [windows-port, master]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    # Only build service and shared (stream and client require WinUI which needs special setup)
    defaults:
      run:
        shell: pwsh
        working-directory: src-windows

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore shared
      run: dotnet restore shared/gnome-network-displays.shared.csproj

    - name: Build shared (${{ matrix.configuration }})
      run: dotnet build shared/gnome-network-displays.shared.csproj -c ${{ matrix.configuration }}

    - name: Restore service
      run: dotnet restore service/gnome-network-displays.service.csproj

    - name: Build service (${{ matrix.configuration }})
      run: dotnet build service/gnome-network-displays.service.csproj -c ${{ matrix.configuration }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.configuration }}-binaries
        path: |
          src-windows/shared/bin/${{ matrix.configuration }}/**/*.dll
          src-windows/service/bin/${{ matrix.configuration }}/**/*.exe
          src-windows/service/bin/${{ matrix.configuration }}/**/*.dll
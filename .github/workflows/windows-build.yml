name: Windows Build

on:
  push:
    branches: [windows-port, master]
  pull_request:
    branches: [windows-port, master]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: src-windows

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore shared
      run: dotnet restore shared/gnome-network-displays.shared.csproj

    - name: Build shared
      run: dotnet build shared/gnome-network-displays.shared.csproj -c Debug --no-restore

    - name: Restore service
      run: dotnet restore service/gnome-network-displays.service.csproj

    - name: Build service
      run: dotnet build service/gnome-network-displays.service.csproj -c Debug --no-restore

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-debug-binaries
        path: |
          src-windows/shared/bin/Debug/**/*.dll
          src-windows/service/bin/Debug/**/*.exe
          src-windows/service/bin/Debug/**/*.dll